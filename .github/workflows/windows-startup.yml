name: Release boundaries (static)
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  startup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse source and check release boundaries without executing application code
        shell: pwsh
        run: ./tools/Test-ReleaseBoundary.ps1
